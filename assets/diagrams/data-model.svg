<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1110" viewBox="0 0 1280 1110" role="img" aria-labelledby="title desc">
<title id="title">원장 문서와 이벤트 식별자의 연결</title><desc id="desc">MongoDB의 실제 저장 필드와 앱 이벤트 안의 논리적 관계를 구분</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8da2"/></marker></defs>
<rect width="1280" height="100%" fill="#f4f7fb"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
<text x="48" y="37" font-size="15" fill="#245fba" font-weight="700" text-anchor="start" letter-spacing="2">DATA MODEL · PHYSICAL &amp; LOGICAL</text>
<text x="48" y="85" font-size="33" fill="#142c45" font-weight="700" text-anchor="start">원장 문서와 이벤트 식별자의 연결</text>
<text x="48" y="118" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">MongoDB의 실제 저장 필드와 앱 이벤트 안의 논리적 관계를 구분</text>
<rect x="40" y="155" width="1200" height="330" rx="18" fill="#eef2fb" stroke="#eef2fb" stroke-width="1.5"/>
<text x="62" y="194" font-size="22" fill="#245fba" font-weight="700" text-anchor="start">01  PHYSICAL  ·  실제 MongoDB 이벤트 원장</text>
<rect x="62" y="219" width="660" height="235" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="62" y="219" width="660" height="48" rx="16" fill="#245fba" stroke="#245fba" stroke-width="1.5"/>
<text x="84" y="251" font-size="23" fill="white" font-weight="700" text-anchor="start">EVENT_LEDGER</text>
<text x="84" y="304" font-size="21" fill="#245fba" font-weight="700" text-anchor="start">_id</text>
<text x="231" y="304" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">string · 고유 키</text>
<text x="449" y="304" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">앱 event_id</text>
<path d="M84 317 L699 317" fill="none" stroke="#7a8da2" stroke-width="2.4"/>
<text x="84" y="346" font-size="21" fill="#142c45" font-weight="700" text-anchor="start">topic</text>
<text x="231" y="346" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">string</text>
<text x="449" y="346" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">Kafka 토픽</text>
<path d="M84 359 L699 359" fill="none" stroke="#7a8da2" stroke-width="2.4"/>
<text x="84" y="388" font-size="21" fill="#142c45" font-weight="700" text-anchor="start">offset</text>
<text x="231" y="388" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">integer</text>
<text x="449" y="388" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">파티션 내부 위치</text>
<path d="M84 401 L699 401" fill="none" stroke="#7a8da2" stroke-width="2.4"/>
<text x="84" y="430" font-size="21" fill="#142c45" font-weight="700" text-anchor="start">payload</text>
<text x="231" y="430" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">string</text>
<text x="449" y="430" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">JSON 이벤트 원문</text>
<text x="765" y="264" font-size="24" fill="#7050b2" font-weight="700" text-anchor="start">조회·검증의 기준</text>
<text x="765" y="308" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">• event_id로 단건 추적</text>
<text x="765" y="345" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">• topic · offset으로 처리 위치 대조</text>
<text x="765" y="382" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">• payload 원문을 보존</text>
<text x="765" y="419" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">• 최근 조회는 복합 인덱스 사용</text>
<rect x="40" y="527" width="1200" height="500" rx="18" fill="#edf8f4" stroke="#edf8f4" stroke-width="1.5"/>
<text x="62" y="568" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">02  LOGICAL  ·  앱 이벤트 안의 식별자 관계</text>
<rect x="62" y="619" width="244" height="121" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="62" y="639" width="5" height="81" rx="2" fill="#087f72"/>
<text x="84" y="654" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">앱 사용자</text>
<text x="84" y="688" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">user_id</text>
<text x="84" y="715" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">익명 앱 식별자</text>
<rect x="364" y="619" width="244" height="121" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="364" y="639" width="5" height="81" rx="2" fill="#087f72"/>
<text x="386" y="654" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">앱 세션</text>
<text x="386" y="688" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">session_id</text>
<text x="386" y="715" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">앱 실행 단위</text>
<path d="M318 680 L351 680" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M621 680 L668 680" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="682" y="619" width="536" height="275" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="682" y="639" width="5" height="235" rx="2" fill="#7050b2"/>
<text x="704" y="654" font-size="22" fill="#7050b2" font-weight="700" text-anchor="start">LEARNING_EVENT</text>
<text x="704" y="688" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">event_id → 원장 _id</text>
<text x="704" y="715" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">user_id · session_id</text>
<text x="704" y="742" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">lesson_id · reading_id</text>
<text x="704" y="769" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">event_type · event_time · seq</text>
<rect x="62" y="817" width="244" height="121" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="62" y="837" width="5" height="81" rx="2" fill="#087f72"/>
<text x="84" y="852" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">학습 단위</text>
<text x="84" y="886" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">lesson_id</text>
<text x="84" y="913" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">시작·시도·종료 연결</text>
<rect x="364" y="817" width="244" height="121" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="364" y="837" width="5" height="81" rx="2" fill="#087f72"/>
<text x="386" y="852" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">인식 단위</text>
<text x="386" y="886" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">reading_id</text>
<text x="386" y="913" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">인식·사용자 확인 연결</text>
<path d="M306 876 H331 V971 H982 V909" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M608 876 H646 V812 H668" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="684" y="956" font-size="17" fill="#536b80" font-weight="400" text-anchor="start">이벤트 종류에 따라 식별자를 연결</text>
<text x="48" y="1085" font-size="16" fill="#536b80" font-weight="400" text-anchor="start">아래 관계는 payload 내부의 논리적 연결  ·  별도 사용자·학습 컬렉션이나 외래 키 제약을 뜻하지 않음</text>
</g>
</svg>