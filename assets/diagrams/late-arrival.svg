<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="865" viewBox="0 0 1280 865" role="img" aria-labelledby="title desc">
<title id="title">뒤늦게 도착한 학습 기록 9건의 대조</title><desc id="desc">발생 시각을 유지한 대기 기록을 폰 전송 로그와 MongoDB 원장에서 연결</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8da2"/></marker></defs>
<rect width="1280" height="100%" fill="#f4f7fb"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
<text x="48" y="37" font-size="15" fill="#245fba" font-weight="700" text-anchor="start" letter-spacing="2">LATE ARRIVAL · DELIVERY TRACE</text>
<text x="48" y="85" font-size="33" fill="#142c45" font-weight="700" text-anchor="start">뒤늦게 도착한 학습 기록 9건의 대조</text>
<text x="48" y="118" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">발생 시각을 유지한 대기 기록을 폰 전송 로그와 MongoDB 원장에서 연결</text>
<rect x="48" y="155" width="165" height="32" rx="16" fill="#087f72" stroke="#087f72" stroke-width="1.5"/>
<text x="130.5" y="177" font-size="14" fill="white" font-weight="700" text-anchor="middle">대기 기록 9건</text>
<rect x="231" y="155" width="142" height="32" rx="16" fill="#245fba" stroke="#245fba" stroke-width="1.5"/>
<text x="302.0" y="177" font-size="14" fill="white" font-weight="700" text-anchor="middle">HTTP 202</text>
<rect x="391" y="155" width="190" height="32" rx="16" fill="#7050b2" stroke="#7050b2" stroke-width="1.5"/>
<text x="486.0" y="177" font-size="14" fill="white" font-weight="700" text-anchor="middle">원장 578~586</text>
<rect x="48" y="264" width="267" height="176" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="48" y="284" width="5" height="136" rx="2" fill="#087f72"/>
<text x="70" y="299" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">01  학습 동작</text>
<text x="70" y="333" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">event_time</text>
<text x="70" y="360" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">09:06~09:07</text>
<path d="M323 350 L342 350" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="353" y="264" width="267" height="176" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="353" y="284" width="5" height="136" rx="2" fill="#b96c1d"/>
<text x="375" y="299" font-size="22" fill="#b96c1d" font-weight="700" text-anchor="start">02  Outbox 대기</text>
<text x="375" y="333" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">event_id 보존</text>
<text x="375" y="360" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">발생 시각 유지</text>
<path d="M628 350 L647 350" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="658" y="264" width="267" height="176" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="658" y="284" width="5" height="136" rx="2" fill="#245fba"/>
<text x="680" y="299" font-size="22" fill="#245fba" font-weight="700" text-anchor="start">03  API 수신</text>
<text x="680" y="333" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">received_at</text>
<text x="680" y="360" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">09:13:01</text>
<path d="M933 350 L952 350" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="963" y="264" width="267" height="176" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="963" y="284" width="5" height="136" rx="2" fill="#7050b2"/>
<text x="985" y="299" font-size="22" fill="#7050b2" font-weight="700" text-anchor="start">04  원장 저장</text>
<text x="985" y="333" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">오프셋 578~586</text>
<text x="985" y="360" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">9건 저장 대조</text>
<text x="48" y="232" font-size="20" fill="#142c45" font-weight="700" text-anchor="start">앱 발생 → 폰 보관 → 서버 수신 → 비동기 적재</text>
<path d="M792 453 V504 H487 V453" fill="none" stroke="#7a8da2" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="640" y="534" font-size="18" fill="#245fba" font-weight="400" text-anchor="middle">Kafka 발행 확인 후 HTTP 202 응답</text>
<rect x="48" y="582" width="1184" height="174" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<text x="72" y="621" font-size="23" fill="#142c45" font-weight="700" text-anchor="start">관측 시간 해석 기준</text>
<text x="72" y="659" font-size="20" fill="#536b80" font-weight="400" text-anchor="start">event_time → received_at : 폰 대기·재전송 시간 포함</text>
<text x="72" y="695" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">적재 확인 : 이벤트 ID · HTTP 응답 · Kafka 위치 · DB 원문 대조</text>
<text x="72" y="729" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">후속 학습 8건 : HTTP 202 · 원장 오프셋 587~594 연결</text>
<text x="48" y="840" font-size="16" fill="#536b80" font-weight="400" text-anchor="start">표시 시각: 한국 시간  ·  발생→수신 간격을 Spark 처리 시간이나 DB 쓰기 시간으로 환산하지 않음</text>
</g>
</svg>