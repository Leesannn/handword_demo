<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">화면 조작에서 학습 기록까지</title><desc id="desc">시작·시도·판정·재시도를 구분한 이벤트 흐름</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8da2"/></marker></defs>
<rect width="1280" height="100%" fill="#f4f7fb"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
<text x="48" y="37" font-size="15" fill="#245fba" font-weight="700" text-anchor="start" letter-spacing="2">APP EXPERIENCE · LEARNING EVENTS</text>
<text x="48" y="85" font-size="33" fill="#142c45" font-weight="700" text-anchor="start">화면 조작에서 학습 기록까지</text>
<text x="48" y="118" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">시작·시도·판정·재시도를 구분한 이벤트 흐름</text>
<rect x="40" y="154" width="1200" height="266" rx="18" fill="#eaf7f3" stroke="#eaf7f3" stroke-width="1.5"/>
<text x="62" y="190" font-size="21" fill="#087f72" font-weight="700" text-anchor="start">01  PRACTICE  ·  본보기에서 동작 판정까지</text>
<rect x="62" y="220" width="338" height="150" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="62" y="240" width="5" height="110" rx="2" fill="#087f72"/>
<text x="84" y="255" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">본보기 · 따라 하기</text>
<text x="84" y="289" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">lesson_started</text>
<text x="84" y="316" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">학습 단위 시작</text>
<rect x="471" y="220" width="338" height="150" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="471" y="240" width="5" height="110" rx="2" fill="#087f72"/>
<text x="493" y="255" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">준비 · 시도 시작</text>
<text x="493" y="289" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">practice_attempt</text>
<text x="493" y="316" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">3 · 2 · 1 후 동작 입력</text>
<rect x="880" y="220" width="338" height="150" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="880" y="240" width="5" height="110" rx="2" fill="#087f72"/>
<text x="902" y="255" font-size="22" fill="#087f72" font-weight="700" text-anchor="start">동작 판정</text>
<text x="902" y="289" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">recognition_result</text>
<text x="902" y="316" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">성공·미인식 결과 기록</text>
<path d="M410 295 L459 295" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M819 295 L868 295" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40" y="458" width="1200" height="278" rx="18" fill="#edf3fc" stroke="#edf3fc" stroke-width="1.5"/>
<text x="62" y="495" font-size="21" fill="#245fba" font-weight="700" text-anchor="start">02  NEXT ACTION  ·  결과 이후의 사용자 선택</text>
<rect x="62" y="525" width="338" height="170" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="62" y="545" width="5" height="130" rx="2" fill="#b96c1d"/>
<text x="84" y="560" font-size="22" fill="#b96c1d" font-weight="700" text-anchor="start">실패 후 다시 시작</text>
<text x="84" y="594" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">retry + practice_attempt</text>
<text x="84" y="621" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">이전 실패와 새 시도 연결</text>
<text x="84" y="648" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">동작 판정 단계로 재진입</text>
<rect x="471" y="525" width="338" height="170" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="471" y="545" width="5" height="130" rx="2" fill="#245fba"/>
<text x="493" y="560" font-size="22" fill="#245fba" font-weight="700" text-anchor="start">한 번 더</text>
<text x="493" y="594" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">practice_attempt</text>
<text x="493" y="621" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">새 연습 시도 기록</text>
<text x="493" y="648" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">준비 단계부터 반복</text>
<rect x="880" y="525" width="338" height="170" rx="18" fill="white" stroke="#dce5ee" stroke-width="1.5"/>
<rect x="880" y="545" width="5" height="130" rx="2" fill="#7050b2"/>
<text x="902" y="560" font-size="22" fill="#7050b2" font-weight="700" text-anchor="start">누적 세 번째 성공</text>
<text x="902" y="594" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">lesson_completed</text>
<text x="902" y="621" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">학습 완료 기록</text>
<text x="902" y="648" font-size="18" fill="#536b80" font-weight="400" text-anchor="start">닫기·마치기: lesson_ended</text>
<path d="M1049 380 L1049 443" fill="none" stroke="#7a8da2" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1025" y="412" font-size="17" fill="#536b80" font-weight="400" text-anchor="end">결과에 따른 분기</text>
<rect x="40" y="778" width="1200" height="180" rx="18" fill="#f2edfa" stroke="#f2edfa" stroke-width="1.5"/>
<text x="62" y="818" font-size="21" fill="#7050b2" font-weight="700" text-anchor="start">03  USER FEEDBACK  ·  번역 후보의 확인과 수정</text>
<text x="64" y="861" font-size="24" fill="#7050b2" font-weight="700" text-anchor="start">answer_selected</text>
<text x="64" y="899" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">was_corrected = false  기존 후보 확인</text>
<text x="650" y="899" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">was_corrected = true  다른 낱말로 수정</text>
<text x="62" y="937" font-size="17" fill="#536b80" font-weight="400" text-anchor="start">상세 열기·탭 이동 자체는 이벤트 미생성 · 학습 화면 닫기는 lesson_ended</text>
<text x="48" y="1015" font-size="16" fill="#536b80" font-weight="400" text-anchor="start">retry와 practice_attempt는 서로 다른 이벤트 유형 · 두 기록을 연습 두 번으로 중복 집계하지 않음</text>
</g>
</svg>