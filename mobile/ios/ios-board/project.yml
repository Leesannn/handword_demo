# XcodeGen 설정. 프로젝트 다시 만들기: xcodegen generate && pod install
# 카메라·MediaPipe·전처리·판정 코드와 모델은 ../ios/KSLSign 의 것을 복사하지 않고 그대로 가져다 쓴다 (엔진은 하나)
name: KSLBoard
options:
  bundleIdPrefix: com.seeolgani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 생성 클래스 대신 MLModel을 직접 쓴다 (KSLSign과 같다)
    COREML_CODEGEN_LANGUAGE: None
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  KSLBoard:
    type: application
    platform: iOS
    sources:
      - path: KSLBoard
      - path: ../ios/KSLSign/Core
      - path: ../ios/KSLSign/Capture
      - path: ../ios/KSLSign/Resources
      - path: ../ios/KSLSign/Model/ksl_r0006.mlpackage
        type: file
        buildPhase: sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 수어 칠판
        NSCameraUsageDescription: 수어 동작을 읽으려고 카메라를 씁니다. 영상은 저장하거나 기기 밖으로 보내지 않습니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: Board
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seeolgani.kslboard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4ZY7BULYK4
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # 시뮬레이터에서 앱을 한 바퀴 눌러 보며 화면을 찍는 점검
  KSLBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KSLBoardUITests
    dependencies:
      - target: KSLBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seeolgani.kslboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KSLBoard
        DEVELOPMENT_TEAM: 4ZY7BULYK4
        CODE_SIGN_STYLE: Automatic
schemes:
  KSLBoard:
    build:
      targets:
        KSLBoard: all
        KSLBoardUITests: [test]
    run:
      config: Debug
    test:
      targets: [KSLBoardUITests]
